<html lang="de">
<head>

<style>
/* Layout: eine schmale Spalte wie ein Fahrplan. Oben die Anzeigetafel (Jetzt / Als Nächstes), darunter fünf Reiter. */
:root {
  --bg: #EDF0F3; --surface: #FFFFFF; --ink: #131D27; --muted: #5B6875; --line: #D5DBE2;
  --accent: #C0112B; --accent-ink: #FFFFFF; --soft: #FBE7EA;
  --ok: #1F7A4D; --ok-soft: #DDF1E6; --warn: #9A5A00; --warn-soft: #FBEBCF;
  --board: #16212C; --board-ink: #F2F5F8; --board-dim: #9FB0C0; --board-pop: #FF7385;
  --scrim: rgba(8, 12, 16, 0.55);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E141A; --surface: #17202A; --ink: #E8EDF2; --muted: #93A0AD; --line: #28333F;
    --accent: #FF5A70; --accent-ink: #1A0509; --soft: #3A1820;
    --ok: #5FD39A; --ok-soft: #14301F; --warn: #F0B35A; --warn-soft: #3A2C12;
    --board: #1D2A37; --board-ink: #F2F5F8; --board-dim: #9FB0C0; --board-pop: #FF7385;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--body);
  padding-top: calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.head { display: flex; flex-direction: column; gap: 2px; }
.head h1 { font: 800 28px/1.05 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 13px; }
.status { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; margin-top: 6px; }
.st { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.st-ok { color: var(--ok); } .st-ok::before { background: var(--ok); }
.st-busy { color: var(--warn); } .st-busy::before { background: var(--warn); }
.st-err { color: var(--accent); } .st-err::before { background: var(--accent); }
.st-btns { display: flex; gap: 2px; flex-wrap: wrap; }
.link { background: none; border: 0; padding: 8px 8px; min-height: 36px; color: var(--ink); font-weight: 600; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }

.board { background: var(--board); color: var(--board-ink); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); }
.board-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--board-dim); }
.board-top .mono { color: var(--board-ink); letter-spacing: 0; font-size: 12px; }
.board-main { font: 800 24px/1.1 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.board-main .mono { font-size: 20px; color: var(--board-pop); margin-right: 8px; }
.board-sub { color: var(--board-dim); font-size: 13px; }
.board-sub b { color: var(--board-ink); font-weight: 600; }
.board-go { color: var(--board-pop); font-weight: 600; font-size: 13px; text-decoration: none; padding: 6px 0 2px; overflow-wrap: anywhere; }
.route { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.btn.btn-route { display: inline-flex; align-items: center; text-decoration: none; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card a.btn-route { color: var(--accent-ink); font-size: 15px; }
.place { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.link-sm, .card a.link-sm { font-size: 13px; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.vote { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.vbtn { min-height: 40px; min-width: 60px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; }
.vbtn.on { border-color: var(--accent); background: var(--soft); }
.vnames { font-size: 12px; color: var(--muted); flex-basis: 100%; overflow-wrap: anywhere; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 2px 9px; min-height: 44px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--mono); font-size: 11px; margin-left: 3px; color: var(--muted); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; min-height: 52px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.seg-btn[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg-d { font: 800 16px/1.1 var(--display); }
.seg-s { font-size: 12px; opacity: 0.75; }
.day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.day-head h2, .sec-title { font: 800 18px/1.2 var(--display); margin: 0; }
.day-head span { color: var(--muted); font-size: 13px; }

.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.row { border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row-main { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; background: none; border: 0; padding: 12px 14px; min-height: 56px; }
.time { font: 700 14px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
.body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.title { font-weight: 600; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cost { font: 500 13px/1.7 var(--mono); color: var(--muted); white-space: nowrap; }
.chip, .pill { font-size: 11px; line-height: 1; padding: 4px 7px; border-radius: 4px; letter-spacing: 0.02em; }
.chip { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.pill-fix, .pill-drin { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pill-offen, .pill-pruefen { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.pill-now { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pill-next { background: var(--soft); color: var(--accent); font-weight: 600; }
.pill-raus { background: var(--bg); color: var(--muted); border: 1px solid var(--line); font-weight: 600; }
.row.is-now { background: var(--soft); }
.row.is-past .title, .row.is-past .time { color: var(--muted); }
.row.is-done .title { text-decoration: line-through; color: var(--muted); }
.detail { padding: 0 14px 14px 76px; display: flex; flex-direction: column; gap: 10px; }
.note { margin: 0; white-space: pre-line; font-size: 14px; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.shift { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.shift-l { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-right: 2px; }
.sbtn { min-width: 52px; min-height: 40px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); font: 700 13px var(--mono); }
.chk-l { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); min-height: 32px; }
.chk-l input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }
.btn { min-height: 40px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-danger { background: transparent; color: var(--accent); border-color: var(--accent); }
.btn-add { width: 100%; background: transparent; color: var(--ink); border: 1px dashed var(--muted); min-height: 48px; border-radius: 8px; font-weight: 600; }
.notice { padding: 12px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card.is-raus { opacity: 0.8; }
.card h3 { font: 800 16px/1.25 var(--display); margin: 0; overflow-wrap: anywhere; }
.card .price { font: 500 13px/1.4 var(--mono); color: var(--muted); }
.card a { color: var(--accent); font-weight: 600; font-size: 13px; }

.big { font: 800 40px/1 var(--display); letter-spacing: -0.02em; }
.big small { font: 500 14px var(--body); color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.track { position: relative; height: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; margin-bottom: 18px; }
.fill { height: 100%; background: var(--ok); border-radius: 2px; }
.fill.over { background: var(--warn); }
.mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.mark-l { position: absolute; top: 20px; transform: translateX(-100%); font: 500 11px var(--mono); color: var(--muted); padding-right: 5px; white-space: nowrap; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13px; }
.bar-row .mono { text-align: right; }
.bar { height: 8px; background: var(--bg); border-radius: 2px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.tips, .steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

.todo { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; border-top: 1px solid var(--line); }
.todo:first-child { border-top: 0; }
.todo .chk { width: 44px; height: 48px; background: none; border: 0; display: grid; place-items: center; }
.box { width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 5px; display: grid; place-items: center; font-weight: 800; font-size: 14px; line-height: 1; }
.todo.is-done .box { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.todo.is-done .t { text-decoration: line-through; color: var(--muted); }
.todo .t { padding: 10px 0; overflow-wrap: anywhere; }
.todo .edit { background: none; border: 0; color: var(--muted); padding: 10px 14px; min-height: 44px; font-size: 13px; }
.addbar { display: flex; gap: 8px; }
.addbar input { flex: 1; min-width: 0; }

.chat { display: flex; flex-direction: column; gap: 10px; }
.bub { max-width: 88%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; min-width: 0; align-self: flex-end; }
.bub p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.bub small { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }
.bub-claude { align-self: flex-start; background: var(--soft); border-color: var(--soft); }
.compose { display: flex; flex-direction: column; gap: 8px; }

input[type=text], input[type=password], input[type=time], input[type=url], select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 16px; }
textarea { min-height: 96px; resize: vertical; }
.sheet { position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.panel { position: relative; width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 14px 14px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font: 800 20px/1.2 var(--display); margin: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.err { color: var(--accent); font-size: 13px; min-height: 18px; margin: 0; }
.panel .actions { justify-content: space-between; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; max-width: calc(100% - 32px); }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } .bar-row { grid-template-columns: 70px minmax(0, 1fr) 58px; } .tab { font-size: 13px; } }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>Köln Wochenende</h1>
    <p id="sub">Fr 6. – So 8. Nov 2026 · 3 Leute</p>
    <div class="status" id="status"></div>
  </header>
  <section id="banner" aria-live="polite"></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche"></nav>
  <main id="view" class="stack"></main>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  var DEFAULT_DATES = { fr: "2026-11-06", sa: "2026-11-07", so: "2026-11-08" };
  var DAYS = [
    { id: "fr", short: "Fr", long: "Freitag", date: "6. Nov" },
    { id: "sa", short: "Sa", long: "Samstag", date: "7. Nov" },
    { id: "so", short: "So", long: "Sonntag", date: "8. Nov" }
  ];
  var CATS = { fahrt: "Fahrt", hotel: "Hotel", stadt: "Stadt", essen: "Essen", bar: "Bar", action: "Action", kultur: "Museum", club: "Club", chill: "Pause" };
  var TAGS = { club: "Club", action: "Action", markt: "Markt", kultur: "Museum / Kultur", essen: "Essen" };
  var TAG2CAT = { club: "club", action: "action", markt: "stadt", kultur: "kultur", essen: "essen" };
  var VERDICTS = { drin: "Im Rennen", pruefen: "Noch prüfen", raus: "Raus" };
  var COLS = ["plan", "ideas", "todos", "notes", "shop"];
  var LS_TOKEN = "kw-token", LS_CACHE = "kw-cache", LS_SHIFT = "kw-shift", LS_NAME = "kw-name";

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };

  /* Wo liegt die Datei? */
  function repoInfo() {
    var meta = document.querySelector('meta[name="kw-repo"]');
    var m = meta && meta.content.trim();
    if (m && m.indexOf("/") > 0) { var p = m.split("/"); return { owner: p[0], repo: p[1], path: p.slice(2).concat(["data.json"]).join("/") }; }
    if (/\.github\.io$/i.test(location.hostname)) {
      var owner = location.hostname.split(".")[0];
      var segs = location.pathname.split("/").filter(Boolean);
      if (segs.length && /\.html?$/i.test(segs[segs.length - 1])) segs.pop();
      var repo = segs.length ? segs[0] : owner + ".github.io";
      var dir = segs.slice(1);
      return { owner: owner, repo: repo, path: dir.concat(["data.json"]).join("/") };
    }
    return null;
  }
  var REPO = repoInfo();

  var state = {
    data: null, sha: null, token: lsGet(LS_TOKEN) || null,
    tab: "plan", day: null, open: null,
    pend: { set: {}, del: {} }, inflight: null,
    saving: false, saveTimer: null, saveAgain: false, saveError: null, savedAt: null, conflicts: 0,
    loading: false, loadError: null, fetchedAt: null, lastMsg: "",
    shiftRest: lsGet(LS_SHIFT) !== "0", draft: "", todoDraft: "", shopDraft: ""
  };
  function canEdit() { return !!(state.token && REPO); }

  function h(tag, props) {
    var e = document.createElement(tag);
    for (var k in (props || {})) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    }
    (function add(list) {
      list.forEach(function (c) {
        if (c == null || c === false) return;
        if (Array.isArray(c)) return add(c);
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function uid() { return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function fmt(n) { return n.toLocaleString("de-DE", { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  function money(c) { return c == null ? "–" : (c === 0 ? "frei" : fmt(c) + " €"); }
  function hm(ts) { return new Date(ts).toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" }); }
  function toMin(t) { var m = String(t || "0:0").split(":"); return (+m[0] || 0) * 60 + (+m[1] || 0); }
  function fromMin(n) { n = Math.max(0, Math.min(1439, n)); var hh = Math.floor(n / 60), mm = n % 60; return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm; }
  function dayName(id) { var d = DAYS.filter(function (x) { return x.id === id; })[0]; return d ? d.long : id; }

  /* Hinfahren: Karten-App mit Bus und Bahn */
  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
  function appleUrl(place) { return "https://maps.apple.com/?daddr=" + encodeURIComponent(place) + "&dirflg=r"; }
  function googleUrl(place) { return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(place) + "&travelmode=transit"; }
  function mapsUrl(place) { return isIOS() ? appleUrl(place) : googleUrl(place); }
  function routeBox(place) {
    if (!place) return null;
    return h("div", { class: "route" },
      h("a", { class: "btn btn-route", href: mapsUrl(place), target: "_blank", rel: "noopener" }, "Hinfahren"),
      h("span", { class: "place" }, place),
      isIOS() ? h("a", { class: "link-sm", href: googleUrl(place), target: "_blank", rel: "noopener" }, "Google Maps") : null);
  }

  /* Base64 mit Umlauten */
  function toB64(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function fromB64(b) {
    var bin = atob(String(b).replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  /* Daten */

  /* GitHub */

  function dropToken(msg) {

  function queueSave(delay) {

    if (state.sha) body.sha = state.sha;

    var headers = authHeaders(); headers["Content-Type"] = "application/json";

      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { s: r.status, ok: r.ok, j: j }; }); })
      .then(function (x) {

        }
        if (x.s === 401) state.saveError = "Der Schlüssel ist ungültig oder abgelaufen. Unter „Gerät“ neu eingeben.";
        else if (x.s === 403 || x.s === 404) state.saveError = "Der Schlüssel darf nicht in dieses Repo schreiben. Beim Schlüssel muss „Contents: Read and write“ erlaubt sein.";

  }

  /* Zeit in Berlin */
  function berlinNow() {

  function sortedPlan() {

      }, function (x) {
        submit.disabled = false;
        err.textContent = x && x.code === "auth" ? "Der Token ist ungültig. Bitte neu kopieren."
          : x && x.code === "noaccess" ? "Der Token hat keinen Zugriff auf " + REPO.owner + "/" + REPO.repo + ". Beim Token dieses Repo auswählen."
          : "Prüfen fehlgeschlagen. Internet prüfen und erneut versuchen.";
      });
    });
    showSheet(form);
  }

  /* Start */
  var cached = readCache();
  if (cached) {
    state.data = normalize(cached.data); state.sha = cached.sha || null; state.fetchedAt = cached.at || null;
    if (cached.pend && cached.pend.set && cached.pend.del) state.pend = cached.pend;
  }
  state.day = initialDay();
  render();
  load(true);
  setInterval(function () {
    renderBanner();
    if (document.visibilityState !== "visible") return;
    if (canEdit() && pendCount() && !state.saving && !state.saveTimer && state.saveError && /Verbindung/.test(state.saveError)) { state.saveError = null; doSave(); }
  }, 30000);
  setInterval(function () { if (document.visibilityState === "visible") load(false); }, 120000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && (!state.fetchedAt || Date.now() - state.fetchedAt > 30000)) load(false);
  });
  /* Offline: App-Dateien im Speicher behalten, bei Netz sofort nachladen und speichern */
  window.addEventListener("offline", function () { render(); });
  window.addEventListener("online", function () {
    if (canEdit() && pendCount() && !state.saving) { state.saveError = null; doSave(); }
    load(true);
  });
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
